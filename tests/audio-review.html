<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonwool lullaby review</title><style>[hidden]{display:none!important}body{background:#0b1225;color:#d7e5d5;font:16px system-ui;max-width:650px;margin:50px auto;padding:24px;line-height:1.7}button,a{display:inline-block;border:1px solid #bbd7bb66;background:#b8d6b81a;color:inherit;border-radius:14px;padding:14px 22px;font:inherit;margin:8px 8px 8px 0}audio{width:100%;margin-top:20px}p{color:#a6bbbc}</style><h1>Moonwool</h1><p>An original, gentle 3/4 lullaby. This eighteen-second sample uses the game’s actual synthesizer: clear at first, muffled from 6–11 seconds, then gently opening up again.</p><button id="render">Render soundtrack sample</button><p id="status">Ready to render locally.</p><audio controls hidden></audio><a id="download" hidden download="moonwool-lullaby.wav">Download sample</a><p><a href="/">Play Baa’d Math →</a></p><script type="module">
import {lullabyScore,musicRoom,scheduleMusicNote} from '../src/music.js';
document.querySelector('#render').onclick=async()=>{
try{
 document.querySelector('#status').textContent='Rendering the lullaby…';
 const context=new OfflineAudioContext(2,44100*18,44100),master=context.createGain();master.gain.value=.32;master.connect(context.destination);
 const room=musicRoom(context,master);
 for(const event of lullabyScore())if(event.time<18)scheduleMusicNote(context,room.input,event,event.time);
 room.focus(true,6);room.focus(false,11);
 master.gain.setValueAtTime(.32,16.5);master.gain.linearRampToValueAtTime(0,18);
 const rendered=await context.startRendering(),channels=rendered.numberOfChannels,samples=rendered.length;
 const data=new ArrayBuffer(44+samples*channels*2),view=new DataView(data);
 const write=(at,text)=>{for(let i=0;i<text.length;i++)view.setUint8(at+i,text.charCodeAt(i))};
 write(0,'RIFF');view.setUint32(4,data.byteLength-8,true);write(8,'WAVE');write(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,channels,true);view.setUint32(24,44100,true);view.setUint32(28,44100*channels*2,true);view.setUint16(32,channels*2,true);view.setUint16(34,16,true);write(36,'data');view.setUint32(40,samples*channels*2,true);
 const planes=Array.from({length:channels},(_,i)=>rendered.getChannelData(i));let offset=44;
 for(let frame=0;frame<samples;frame++)for(let channel=0;channel<channels;channel++){view.setInt16(offset,Math.max(-1,Math.min(1,planes[channel][frame]))*32767,true);offset+=2}
 const url=URL.createObjectURL(new Blob([data],{type:'audio/wav'}));
 const audio=document.querySelector('audio');audio.src=url;audio.hidden=false;
 const download=document.querySelector('#download');download.href=url;download.hidden=false;
 document.querySelector('#status').textContent='Sample ready. Music softens at 6 seconds and opens back up after 11 seconds.';
}catch(error){document.querySelector('#status').textContent='Render failed: '+error.message;throw error}
};
</script></html>
