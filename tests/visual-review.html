<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheep personality review</title><style>body{margin:0;background:#0b1225;color:#c8ddd0;font:14px system-ui;text-align:center}h1{font-size:20px;margin:28px 12px 8px}p{font-size:12px;color:#9cadb9}canvas{max-width:100%;height:auto}a{color:#bfdabc}</style><h1>Meet the flock</h1><p>Happy +1 · Angry −1 · Goofy ×2 · Crying ½</p><canvas width="800" height="750"></canvas><p><a href="/">Play Baa’d Math →</a></p><script type="module">
