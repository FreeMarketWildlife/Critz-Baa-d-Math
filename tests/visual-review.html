<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheep personality review</title><style>body{margin:0;background:#0b1225;color:#c8ddd0;font:14px system-ui;text-align:center}h1{font-size:20px;margin:28px 12px 8px}p{font-size:12px;color:#9cadb9}canvas{max-width:100%;height:auto}a{color:#bfdabc}</style><h1>Meet the flock</h1><p>22 personalities · upright fraction labels · brighter smiles when counted</p><canvas width="1000" height="1800"></canvas><p><a href="/">Play Baa’d Math →</a></p><script type="module">
import {drawSheep} from '../src/sheep.js';
import {FLOCK,displayOperation} from '../src/flock.js';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
function frame(time){ctx.clearRect(0,0,canvas.width,canvas.height);for(let i=0;i<FLOCK.length;i++){const s=FLOCK[i],x=125+i%4*250,y=110+Math.floor(i/4)*290;drawSheep(ctx,{op:s.id,vx:i%2?-1:1,counted:false,angle:Math.sin(time/3000)*.4,age:time/1000,crossed:false},x,y,45,s.color);ctx.textAlign='center';ctx.fillStyle='#c8dcd7';ctx.font='16px system-ui';ctx.fillText(`${s.name} · ${displayOperation(s.id)}`,x,y+90);ctx.fillStyle='#9aafbd';ctx.font='13px system-ui';ctx.fillText(`Perfect +${s.bonus}`,x,y+115)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
